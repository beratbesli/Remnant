name: Build binary release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Build and package Linux binary
        run: |
          set -euo pipefail
          cargo build --locked --release
          mkdir -p dist/package
          install -m 0755 target/release/remnant dist/package/remnant
          cp README.md LICENSE dist/package/
          tar -C dist -czf "dist/remnant-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz" package
          sha256sum dist/remnant-*.tar.gz > dist/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remnant-linux
          path: |
            dist/remnant-*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish Linux binary
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: remnant-linux
          path: release-assets
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s release-assets/SHA256SUMS
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "Remnant $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
