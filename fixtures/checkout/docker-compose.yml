services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: remnant
      POSTGRES_PASSWORD: remnant
      POSTGRES_DB: remnant
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remnant -d remnant"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ./app
    environment:
      FIXTURE_DATABASE_URL: postgresql://remnant:remnant@postgres:5432/remnant
      FIXTURE_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
