[package]
name = "remnant"
version = "0.1.0"
edition = "2024"
description = "Reduce a broken application to the smallest persistent state that still reproduces it"
license = "Apache-2.0"
repository = "https://github.com/beratbesli/Remnant"
readme = "README.md"
keywords = ["debugging", "delta-debugging", "postgresql", "redis", "reproducibility"]
categories = ["command-line-utilities", "development-tools::debugging"]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.48", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3.23"

[profile.release]
codegen-units = 1
lto = true
strip = true
