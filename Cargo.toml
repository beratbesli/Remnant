[package]
name = "remnant"
version = "0.1.0"
edition = "2024"
description = "Reduce a broken application to the smallest persistent state that still reproduces it"
license = "Apache-2.0"
repository = "https://github.com/beratbesli/Remnant"
readme = "README.md"
keywords = ["debugging", "delta-debugging", "postgresql", "redis", "reproducibility"]
categories = ["command-line-utilities", "development-tools::debugging"]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.23"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Keep the established serde_yaml API while using the maintained fork.
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.48", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
redis = { version = "1.7", features = ["tokio-comp"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.23"

[profile.release]
codegen-units = 1
lto = true
strip = true
